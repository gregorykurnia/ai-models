  <text x="480" y="281" class="ui muted small">model variants</text>
  <line x1="656" y1="216" x2="656" y2="280" stroke="#E5EAE6"/>
  <text x="688" y="258" class="mono" font-size="28" font-weight="650">6,322</text>
  <text x="688" y="281" class="ui muted small">source observations</text>
  <line x1="907" y1="216" x2="907" y2="280" stroke="#E5EAE6"/>
  <text x="939" y="242" class="ui" font-size="13" font-weight="650">Coverage is shown per model</text>
  <text x="939" y="267" class="ui muted small">Missing ranks remain visible and explicit.</text>
  <rect x="1360" y="230" width="158" height="36" rx="8" fill="#F1F6F3"/>
  <circle cx="1383" cy="248" r="4" fill="#0B6B53"/>
  <text x="1396" y="252" class="ui accent small" font-weight="650">Snapshots healthy</text>

