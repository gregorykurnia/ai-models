  <rect x="310" y="493" width="1204" height="54" rx="8" fill="#F8FAF8"/>
  <text x="334" y="524" class="ui th">MODEL</text>
  <text x="692" y="524" class="ui th">PROVIDER</text>
  <text x="905" y="515" text-anchor="end" class="ui th">TASK COST</text>
