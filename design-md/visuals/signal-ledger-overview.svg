  <path d="M879 439l2.3 4.7 5.2.8-3.8 3.7.9 5.2-4.6-2.5-4.7 2.5.9-5.2-3.8-3.7 5.2-.8z" fill="none" stroke="#0B6B53" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="897" y="452" class="ui accent body" font-weight="650">Favorites</text>

