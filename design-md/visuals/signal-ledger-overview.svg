  <text x="1340" y="678" text-anchor="end" class="mono rank">#06</text>
  <text x="1487" y="678" text-anchor="end" class="mono muted td">17 / 19</text>

  <line x1="310" y1="715" x2="1514" y2="715" stroke="#E5EAE6"/>
  <path d="M337 735l2.6 5.3 5.8.9-4.2 4.1 1 5.8-5.2-2.8-5.3 2.8 1-5.8-4.2-4.1 5.8-.9z" fill="none" stroke="#78837D" stroke-width="1.3"/>
  <text x="360" y="745" class="ui td" font-weight="650">Grok 4.7</text>
