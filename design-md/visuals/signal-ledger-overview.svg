  <line x1="310" y1="795" x2="1514" y2="795" stroke="#E5EAE6"/>
  <path d="M337 815l2.6 5.3 5.8.9-4.2 4.1 1 5.8-5.2-2.8-5.3 2.8 1-5.8-4.2-4.1 5.8-.9z" fill="none" stroke="#78837D" stroke-width="1.3"/>
