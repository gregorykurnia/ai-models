<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title description">
  <title id="title">Signal Ledger design direction for Model Benchmarks</title>
  <description id="description">A light mode desktop product mockup with a stable left navigation rail, warm mineral background, white evidence sheet, evergreen controls, summary metrics, filters, and a dense model leaderboard.</description>
  <defs>
    <filter id="menu-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17211D" flood-opacity="0.12"/>
    </filter>
    <style>
      .ui { font-family: "Geist", Inter, Arial, sans-serif; fill: #17211D; }
      .mono { font-family: "Geist", Inter, Arial, sans-serif; fill: #17211D; font-variant-numeric: tabular-nums; }
      .muted { fill: #59665F; }
      .tertiary { fill: #78837D; }
      .accent { fill: #0B6B53; }
      .white { fill: #FFFFFF; }
      .label { font-size: 12px; font-weight: 650; letter-spacing: .08em; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .nav { font-size: 14px; font-weight: 600; }
      .th { font-size: 11px; font-weight: 700; letter-spacing: .05em; fill: #59665F; }
      .td { font-size: 13px; }
      .rank { font-size: 13px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#F3F5F1"/>

  <!-- Stable app rail -->
  <rect x="0" y="0" width="224" height="1050" fill="#FFFFFF"/>
  <line x1="223.5" y1="0" x2="223.5" y2="1050" stroke="#D9E1DB"/>
  <rect x="28" y="30" width="32" height="32" rx="9" fill="#0B6B53"/>
  <path d="M38 51V41l6 6 6-6v10" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="50" class="ui" font-size="16" font-weight="750">Model Ledger</text>

  <text x="28" y="103" class="ui tertiary label">WORKSPACE</text>
  <rect x="16" y="120" width="192" height="44" rx="8" fill="#EAF3EF"/>
  <rect x="16" y="120" width="3" height="44" rx="1.5" fill="#0B6B53"/>
  <circle cx="39" cy="142" r="6" fill="none" stroke="#0B6B53" stroke-width="1.8"/>
  <path d="M39 138v4l3 2" fill="none" stroke="#0B6B53" stroke-width="1.8" stroke-linecap="round"/>
  <text x="56" y="147" class="ui accent nav">Overview</text>

  <path d="M33 191h12M33 196h8M33 201h10" fill="none" stroke="#59665F" stroke-width="1.8" stroke-linecap="round"/>
  <text x="56" y="199" class="ui muted nav">Evaluations</text>
  <rect x="178" y="183" width="24" height="21" rx="6" fill="#F1F4F2"/>
  <text x="190" y="198" text-anchor="middle" class="mono muted" font-size="10">19</text>

  <path d="M33 242h12M36 238v8M42 238v8" fill="none" stroke="#59665F" stroke-width="1.8" stroke-linecap="round"/>
  <text x="56" y="247" class="ui muted nav">Task fit</text>

  <path d="M34 286h11v13l-5.5-3-5.5 3z" fill="none" stroke="#59665F" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="56" y="295" class="ui muted nav">Saved tasks</text>

  <text x="28" y="358" class="ui tertiary label">REFERENCE</text>
  <circle cx="39" cy="394" r="7" fill="none" stroke="#59665F" stroke-width="1.8"/>
  <path d="M39 393v5M39 389v.5" fill="none" stroke="#59665F" stroke-width="1.8" stroke-linecap="round"/>
  <text x="56" y="399" class="ui muted nav">Data notes</text>

  <rect x="16" y="939" width="192" height="83" rx="10" fill="#F8FAF8" stroke="#D9E1DB"/>
  <circle cx="38" cy="963" r="5" fill="#2B8A69"/>
  <text x="52" y="967" class="ui" font-size="12" font-weight="650">Data current</text>
  <text x="28" y="990" class="mono tertiary" font-size="10">19 evaluations</text>
  <text x="28" y="1008" class="mono tertiary" font-size="10">6,322 observations</text>

