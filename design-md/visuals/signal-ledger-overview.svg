  <text x="1340" y="532" text-anchor="end" class="mono tertiary" font-size="9">RANK</text>
  <text x="1487" y="515" text-anchor="end" class="ui th">COVERAGE</text>
  <text x="1487" y="532" text-anchor="end" class="mono tertiary" font-size="9">OF 19</text>

