  <text x="278" y="151" class="ui muted" font-size="16">Rankings, costs, and benchmark coverage in one traceable view.</text>
  <rect x="1337" y="101" width="209" height="44" rx="8" fill="#0B6B53"/>
  <path d="M1361 118v10M1356 123h10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="1378" y="128" class="ui white" font-size="14" font-weight="700">Create task comparison</text>

  <!-- Summary strip -->
  <rect x="278" y="192" width="1268" height="112" rx="12" fill="#FFFFFF" stroke="#D9E1DB"/>
  <text x="306" y="220" class="ui tertiary label">CURRENT DATASET</text>
  <text x="306" y="258" class="mono" font-size="28" font-weight="650">19</text>
  <text x="306" y="281" class="ui muted small">evaluations</text>
  <line x1="448" y1="216" x2="448" y2="280" stroke="#E5EAE6"/>
