  --panel: rgba(255,255,255,.84); --panel-line: rgba(255,255,255,.9);

  --ink: #13203a; --muted: #475873; --faint: #6b7a93;
  --accent: #7b3fe4; --accent-ink: #5a24bd; --accent-tint: rgba(123,63,228,.12);
  --track: rgba(71,88,115,.14); --tick: #13203a; --rule: rgba(71,88,115,.14);

}

  --panel: rgba(30,39,53,.92); --panel-line: rgba(255,255,255,.07);
  --shadow: 0 18px 40px -24px rgba(0,0,0,.6), 0 2px 6px -3px rgba(0,0,0,.3);
  --ink: #e8eef6; --muted: #b0bdcf; --faint: #8e9cb1;
  --accent: #9b6cf2; --accent-ink: #c4a6ff; --accent-tint: rgba(155,108,242,.18);
  --track: rgba(176,189,207,.16); --tick: #e8eef6; --rule: rgba(176,189,207,.14);
  --good-bg: rgba(52,190,150,.18); --good-ink: #8fe6c9;
  --gap-bg: rgba(240,140,80,.18); --gap-ink: #ffc29a;

} }
:root[data-theme="dark"] {

  --glass: rgba(34,44,59,.45); --glass-line: rgba(255,255,255,.09);

  --ink: #e8eef6; --muted: #b0bdcf; --faint: #8e9cb1;
  --accent: #9b6cf2; --accent-ink: #c4a6ff; --accent-tint: rgba(155,108,242,.18);
  --track: rgba(176,189,207,.16); --tick: #e8eef6; --rule: rgba(176,189,207,.14);
  --good-bg: rgba(52,190,150,.18); --good-ink: #8fe6c9;
  --gap-bg: rgba(240,140,80,.18); --gap-ink: #ffc29a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: linear-gradient(160deg, var(--bg-a), var(--bg-b)) fixed var(--bg-a);
  color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px; overflow-x: hidden;
}
.shape { position: fixed; border-radius: 50%; filter: blur(70px); opacity: var(--shape-op); pointer-events: none; z-index: 0; }
.shape.sky { width: 480px; height: 480px; background: var(--shape-sky); top: -160px; right: -140px; }
.shape.mint { width: 420px; height: 420px; background: var(--shape-mint); bottom: -160px; left: -160px; }
.wrap { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.switcher { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.switcher .label { font-size: 14px; color: var(--muted); margin-right: 4px; }
.pill { font: 600 14px/1 var(--font); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--glass-line);
  background: var(--glass); color: var(--ink); text-decoration: none; backdrop-filter: blur(22px) saturate(140%); }
.pill[aria-current="page"] { background: var(--accent-tint); color: var(--accent-ink); border-color: transparent; }
.pill:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.glass { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 16px; box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; box-shadow: var(--shadow); padding: 24px; }

.hero { padding: 28px 24px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -110px; border-radius: 50%;
  background: var(--accent); opacity: .16; filter: blur(60px); pointer-events: none; }
.eyebrow { font-size: 14px; color: var(--muted); font-weight: 500; }
.hero h1 { font-size: 32px; font-weight: 700; letter-spacing: -.01em; margin-top: 6px; }
.tagline { font-size: 19px; font-weight: 500; margin-top: 12px; max-width: 34em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-ink); }

.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin-bottom: 16px; }
.section-head h2 { font-size: 20px; font-weight: 700; }
.section-head .note { font-size: 14px; color: var(--muted); }
.prose { display: grid; gap: 12px; max-width: 42em; }

.two { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .two { grid-template-columns: 1fr 1fr; } }
.cards { display: grid; gap: 12px; }
.card { padding: 18px 0; border-top: 1px solid var(--rule); display: grid; gap: 8px; }
.card:first-child { border-top: 0; padding-top: 0; }
.card:last-child { padding-bottom: 0; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card h3 { font-size: 17px; font-weight: 700; }
.tag { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.tag.good { background: var(--good-bg); color: var(--good-ink); }
.tag.gap { background: var(--gap-bg); color: var(--gap-ink); }
.card p { color: var(--muted); font-size: 15px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; }
.ref { font-size: 13px; color: var(--ink); background: var(--track); border-radius: 999px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.ref b { font-weight: 700; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.legend .sw-bar { width: 18px; height: 8px; border-radius: 4px; background: var(--accent); }
.legend .sw-tick { width: 2px; height: 14px; background: var(--tick); }

.idx-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .idx-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 900px) { .idx-grid { grid-template-columns: repeat(4, 1fr); } }
.idx { padding: 18px; border-radius: 14px; background: var(--track); display: grid; gap: 8px; align-content: start; }
.idx .name { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.idx .name small { font-size: 13px; font-weight: 500; color: var(--faint); }
.idx .num { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.idx .num span { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.idx .rank { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.idx .desc { font-size: 13px; color: var(--faint); }

.bar { position: relative; height: 8px; border-radius: 4px; background: var(--panel); }
.idx .bar { background: var(--panel); }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); min-width: 4px; }
.bar .prev { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--tick); border-radius: 1px; transform: translateX(-1px); box-shadow: 0 0 0 2px var(--panel); }

.groups { display: grid; gap: 22px; }
@media (min-width: 820px) { .groups { grid-template-columns: 1fr 1fr; column-gap: 32px; } }
.group h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.group h3 span { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 40px; grid-template-areas: "lab val" "bar bar"; gap: 6px 10px;
  padding: 9px 6px; margin-inline: -6px; border-radius: 10px; cursor: default; position: relative; }
.row:hover, .row:focus-visible { background: var(--accent-tint); }
.row .lab { grid-area: lab; font-size: 15px; min-width: 0; }
.row .lab em { font-style: normal; font-size: 13px; color: var(--faint); margin-left: 6px; }
.row .val { grid-area: val; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.row .bar { grid-area: bar; background: var(--track); }
.row .bar .prev { box-shadow: 0 0 0 2px var(--panel); }

.tip { position: fixed; z-index: 20; pointer-events: none; max-width: 280px; padding: 12px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); font-size: 13px; line-height: 1.45; }
.tip b { display: block; font-size: 14px; margin-bottom: 4px; }
.tip .tline { color: var(--muted); font-variant-numeric: tabular-nums; }

.table-wrap { overflow-x: auto; margin-inline: -4px; }
table { border-collapse: collapse; width: 100%; min-width: 440px; font-variant-numeric: tabular-nums; }
th, td { padding: 11px 8px; text-align: right; font-size: 15px; border-bottom: 1px solid var(--rule); }
th:first-child, td:first-child { text-align: left; }
thead th { font-size: 13px; font-weight: 600; color: var(--muted); vertical-align: bottom; }
tbody tr:last-child td { border-bottom: 0; }
td.me { font-weight: 700; color: var(--accent-ink); }
td .lower { font-size: 13px; color: var(--faint); margin-left: 6px; }
.versus { display: grid; gap: 12px; margin-top: 18px; max-width: 42em; }

.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tips li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
.tips li::before { content: ""; width: 28px; height: 28px; border-radius: 9px; background: var(--accent-tint);
  background-image: radial-gradient(circle at 50% 50%, var(--accent) 0 4px, transparent 4.5px); }

.archetype { margin-top: 14px; display: grid; gap: 4px; }
.archetype .aname { font-size: 22px; font-weight: 700; color: var(--accent-ink); }
.archetype .aline { font-size: 16px; color: var(--muted); max-width: 36em; }
.hero .tagline { margin-top: 16px; }

.types { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .types { grid-template-columns: 1fr 1fr; } }
.type-box { padding: 20px; border-radius: 14px; background: var(--track); display: grid; gap: 12px; align-content: start; }
.type-box .k { font-size: 14px; color: var(--muted); font-weight: 500; }
.type-box .big { font-size: 40px; font-weight: 700; line-height: 1.1; letter-spacing: .02em; }
.type-box .big span { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 8px; }
.axis { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding-top: 10px; border-top: 1px solid var(--rule); }
.axis .letter { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-tint); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 17px; }
.axis .what { font-size: 15px; font-weight: 600; }
.axis .why { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis .tie { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--gap-bg); color: var(--gap-ink); margin-left: 6px; }
.enn { display: grid; gap: 7px; }
.enn-row { display: grid; grid-template-columns: 128px minmax(0, 1fr) 30px; gap: 10px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.enn-row .bar { background: var(--panel); }
.enn-row .bar .fill { background: var(--faint); opacity: .55; }
.enn-row.win .bar .fill { background: var(--accent); opacity: 1; }
.enn-row.win { font-weight: 700; }
.enn-row .n { text-align: right; }
.types-note { margin-top: 18px; max-width: 42em; }

.sims { gap: 8px 32px; }
.sim-h { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.sim-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--rule); }
.sim-name { font-size: 15px; font-weight: 600; min-width: 0; }
.sim-name small { display: block; font-size: 13px; font-weight: 500; color: var(--faint); }
.sim-score { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.sim-score span { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.sim-why { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.method { font-size: 14px; color: var(--muted); display: grid; gap: 8px; max-width: 46em; }
.method a { color: var(--accent-ink); }

.fade { animation: fade .45s ease both; }
@keyframes fade { from { opacity: .001; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
@media (min-width: 720px) { .hero h1 { font-size: 40px; } .hero { padding: 36px 32px; } .panel { padding: 28px; } }
</style>

const PROFILES = [{"id": "fable-5-2", "model": "Claude Fable 5.2 (Adaptive Reasoning, Max Effort, Default Fallback)", "display": "Claude Fable 5.2", "variant": "Max effort, adaptive reasoning", "maker": "Anthropic", "previous": "Claude Fable 5.1 (Adaptive Reasoning, Max Effort, Default Fallback)", "compare": ["Claude Fable 5.1 (Adaptive Reasoning, Max Effort, Default Fallback)", "Claude Opus 5.5 (Adaptive Reasoning, Max Effort, Default Fallback)"], "tagline": "A clean, warm and honest writer with real opinions, who leaves the bottom line to you.", "archetype": {"name": "The Candid Confidant", "line": "Tells you what it really thinks, kindly, and trusts you to take it from there."}, "summary": ["Across all 30 traits, Fable 5.2 comes out as a careful conversationalist. Its writing is technically clean (3rd of 53 on Literate) and almost free of filler: on Slop it is one of the six cleanest models tested. Its warmth reads as sincere: it sits around the 80th percentile on all four warmth traits.", "It is honest about what it assumes and rarely flatters. It holds clear opinions (87th percentile) but sounds less sure of itself than most models (39th on Confident), so its views tend to arrive with their reasoning and caveats attached.", "The gap is the practical last mile. It almost never closes with a summary line (50th of 53 on Bottom-Line Summary), and it sits below the middle on step-by-step guidance and on naming specific tools or sources. Expect a thoughtful reply, not a briefing."], "typesNote": "A principled Reformer with a Helper wing: it cares about getting things right and saying them cleanly, and it says them warmly. Thinking and Feeling tie exactly, which fits a model that is as sincere as it is truthful. The P is clear: it explores a question more than it wraps it up.", "bestFor": [{"title": "Honest feedback on your work", "body": "Drafts, plans or ideas you want a straight read on. It says what it thinks, pushes back, and doesn't flatter.", "refs": ["t:sycophantic", "t:opinionated", "t:constructivelyPushesBack"]}, {"title": "Delicate messages", "body": "Apologies, hard emails, condolences or saying no. It is sincere and emotionally attuned, and the writing stays clean.", "refs": ["t:sincere", "t:emotionallyIntelligent", "t:literate"]}, {"title": "Thinking a decision through", "body": "Talking through a choice out loud. It states its assumptions, takes a side and stays open to where the question goes.", "refs": ["t:disclaimsWithAssumptions", "t:opinionated", "t:openEnded"]}, {"title": "Polished prose", "body": "Letters, speeches, essays and bios where filler would hurt. Its grammar and word choice are near the top and it uses little stock phrasing.", "refs": ["t:literate", "t:eloquent", "i:slop"]}], "worstFor": [{"title": "Briefings and status updates", "body": "Busy readers want the takeaway up top and at the end. It almost never writes a bottom line unless asked.", "refs": ["t:summarizesBottomLine", "i:organization"]}, {"title": "Step-by-step how-tos", "body": "Setup guides and checklists need concrete steps and named tools or links, which are both below the middle for it.", "refs": ["t:providesActionableGuidance", "t:resourceSpecific"]}, {"title": "Dense research digests", "body": "When you want the most facts per paragraph, its informativeness lands mid-pack.", "refs": ["i:informativeness", "t:informationDense"]}, {"title": "Confident pitch copy", "body": "Sales pages and pitches that need to sound sure. Its views come out measured rather than bold.", "refs": ["t:confident"]}], "strengths": [{"title": "Clean, precise prose", "body": "Grammar and word choice near the top of the field, eloquent without padding, and very little stock filler.", "refs": ["t:literate", "t:eloquent", "i:slop"]}, {"title": "Warmth that reads as sincere", "body": "Friendly, funny and emotionally attuned, all at about the same level. Nothing feels put on.", "refs": ["t:sincere", "t:emotionallyIntelligent", "t:humorous"]}, {"title": "Honest about its limits", "body": "States the assumptions behind an answer, admits when it isn't sure, and flatters less than four in five models.", "refs": ["t:disclaimsWithAssumptions", "t:truthful", "t:sycophantic"]}, {"title": "Has a point of view", "body": "Takes a position, leads with the answer and will push back when you're wrong.", "refs": ["t:opinionated", "t:answerFirst", "t:constructivelyPushesBack"]}], "gaps": [{"title": "No bottom line", "body": "It rarely ends with a TL;DR or takeaway. Only three models do this less.", "refs": ["t:summarizesBottomLine"]}, {"title": "Light on next steps", "body": "Below the middle on concrete steps and on naming specific tools, links or sources. Informativeness overall lands mid-pack.", "refs": ["t:providesActionableGuidance", "t:resourceSpecific", "i:informativeness"]}, {"title": "Opinions without swagger", "body": "Strong views, quiet delivery. Some readers will want it to sound more certain.", "refs": ["t:confident", "t:opinionated"]}], "versus": ["Against Fable 5.1 it is a quieter model. 5.1 led the field on Conviction and came close on Expressiveness, Informativeness and Transparency. 5.2 gives up density (100 → 64), creativity (100 → 68), confidence (87 → 39) and pushback (100 → 68), and flatters a little more (Sycophantic 5 → 18). In return it answers first more often (30 → 70), is more direct (49 → 70) and uses less filler (Slop 24 → 7).", "Against Opus 5.5 it trades depth and structure for voice. Opus is far more informative (91 vs 47), better organized (79 vs 54) and more imaginative (94 vs 68). Fable 5.2 is more opinionated (87 vs 70), more direct (70 vs 52), less flattering (18 vs 39) and cleaner (Slop 7 vs 20)."], "tips": ["Ask for a one-line bottom line at the end. It won't add one on its own.", "For how-to questions, ask for numbered steps and named tools or links."]}, {"id": "fable-5-1", "model": "Claude Fable 5.1 (Adaptive Reasoning, Max Effort, Default Fallback)", "display": "Claude Fable 5.1", "variant": "Max  ["t:answerFirst", "t:summarizesBottomLine"]}, {"title": "Agrees a little easily", "body": "Mid-pack on flattery: more agreeable than both Fables and Sonnet 5.5.", "refs": ["t:sycophantic"]}], "versus": ["Against Sonnet 5.5, its closest match among all 53 models, Opus is the more creative (98 vs 71), eloquent (83 vs 60), emotionally intelligent (83 vs 52) and pragmatic (92 vs 49) model, and more opinionated (70 vs 47). Sonnet leads on Transparency (100 vs 90), admits uncertainty more (100 vs 89), is easier to skim (83 vs 66) and more open-ended (92 vs 79). Filler is about the same (Slop index 20 vs 18).", "Against Fable 5.2 it trades voice for depth and structure. Opus is far more informative (90 vs 47), better organized (79 vs 54) and more imaginative (94 vs 68). Fable 5.2 is more opinionated (87 vs 70), more direct (70 vs 52), answers first more often (70 vs 52), flatters less (18 vs 39) and uses less filler (Slop index 7 vs 20)."], "tips": ["Ask for its recommendation in one line first, then the reasoning.", "If you want it to commit, ask it to pick one option and say how sure it is.", "For critique, tell it not to soften the verdict."]}, {"id": "sonnet-5-5", "model": "Claude Sonnet 5.5 (Adaptive Reasoning, Max Effort, Default Fallback)", "display": "Claude Sonnet 5.5", "variant": "Max effort, adaptive reasoning", "maker": "Anthropic", "compare": ["Claude Opus 5.5 (Adaptive Reasoning, Max Effort, Default Fallback)", "Claude Haiku 5.5 (Adaptive Reasoning, Max Effort, Default Fallback)"], "tagline": "A meticulous, honest guide who maps every option and every unknown, then lets you choose.", "archetype": {"name": "The Honest Mapmaker", "line": "Charts the whole question in careful detail and marks every blank spot, but leaves the choice of route to you."}, "summary": ["Sonnet 5.5 is the most transparent model tested: 1st of 53 on the Transparency index and on Admits Uncertainty, and 2nd on Truthful. It is also one of the densest: 3rd on Information Dense and 4th on const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const r0 = v => Math.round(v);
const allModels = Object.values(DATA.models);
const N = allModels.length;
const traitMeta = {}; DATA.indexes.forEach(ix => ix.traits.forEach(t => traitMeta[t.key] = { ...t, index: ix.key }));
const indexMeta = {}; DATA.indexes.forEach(ix => indexMeta[ix.key] = ix);
const short = name => name.replace(/\s*\(.*\)\s*$/, "");
const fmtDate = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });

function rankOf(kind, key, value, lower) {
  const vals = allModels.map(m => m[kind][key]).filter(v => v != null);
  const better = lower ? vals.filter(v => v < value).length : vals.filter(v => v > value).length;
  return { rank: better + 1, of: vals.length };
}
function rankText(kind, key, value, lower) {
  const { rank, of } = rankOf(kind, key, value, lower);
  return lower ? `#${rank} lowest of ${of}` : `#${rank} of ${of}`;
}
function refFor(p, ref) {
  const [kind, key] = ref.split(":");
  const me = DATA.models[p.model];
  if (kind === "i") { const ix = indexMeta[key]; return { label: ix.label + " index", v: me.i[key], lower: ix.lower, rk: rankText("i", key, me.i[key], ix.lower) }; }
  const t = traitMeta[key]; return { label: t.label, v: me.t[key], lower: t.lower, rk: rankText("t", key, me.t[key], t.lower) };
}
function bar(v, prev) {
  return `<div class="bar" aria-hidden="true"><div class="fill" style="width:${Math.max(0, Math.min(100, v))}%"></div>${prev != null ? `<div class="prev" style="left:${prev}%"></div>` : ""}</div>`;
}

// MBTI and Enneagram rules: the same fixed rules as for-fun/aa-personalitybench-2026-10-24.md
// ("Just for fun: MBTI and Enneagram guesses"). Change them there and here together.
const ENN = { 1: { name: "Reformer" }, 2: { name: "Helper" }, 3: { name: "Achiever" }, 4: { name: "Individualist" }, 5: { name: "Investigator" },
  6: { name: "Loyalist" }, 7: { name: "Enthusiast" }, 8: { name: "Challenger" }, 9: { name: "Peacemaker" } };
function personalityTypes(m) {
  const I = m.i, T = m.t, lo = v => 100 - v, avg = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
  const near = (a, b) => Math.abs(a - b) < 0.05, EPS = 1e-9; // EPS: ignore float noise, so exact ties follow the rule
  const ei = avg([I.warmth, I.expressiveness, T.humorous]);
  const n = avg([I.imagination, T.metaphorical]), s = avg([T.pragmatic, T.providesActionableGuidance, T.resourceSpecific]);
  const f = avg([T.friendly, T.emotionallyIntelligent, T.sincere]), t = avg([T.direct, T.evidenceBased, T.truthful]);
  const j = avg([T.structured, T.answerFirst, T.summarizesBottomLine]), p = T.openEnded;
  const axes = [
    ei >= 50 ? { letter: "E", name: "Extraverted", why: `Warmth, Expressiveness and Humorous average ${r0(ei)} (E from 50)` }
             : { letter: "I", name: "Introverted", why: `Warmth, Expressiveness and Humorous average ${r0(ei)} (E from 50)` },
    { letter: n >= s - EPS ? "N" : "S", name: n >= s - EPS ? "Intuitive" : "Sensing", tie: near(n, s),
      why: `Imagination and metaphor ${r0(n)} vs practical detail ${r0(s)}` },
    { letter: f > t + EPS ? "F" : "T", name: f > t + EPS ? "Feeling" : "Thinking", tie: near(f, t),
      why: `Directness, evidence and truthfulness ${r0(t)} vs warmth traits ${r0(f)}${near(f, t) ? " (a tie goes to T)" : ""}` },
    { letter: j >= p - EPS ? "J" : "P", name: j >= p - EPS ? "Judging" : "Perceiving", tie: near(j, p),
      why: `Structure, answer-first and bottom line ${r0(j)} vs open-ended ${r0(p)}` },
  ];
  const sc = {
    1: avg([T.truthful, T.structured, T.direct, lo(I.slop)]),
    2: avg([T.friendly, T.emotionallyIntelligent, T.sincere, T.sycophantic]),
    3: avg([T.answerFirst, T.confident, T.providesActionableGuidance, T.scannable]),
    4: avg([T.eloquent, T.metaphorical, T.sincere, T.creative]),
    5: avg([T.informationDense, T.evidenceBased, T.resourceSpecific, lo(T.friendly)]),
    6: avg([T.admitsUncertainty, T.disclaimsWithAssumptions, T.flagsNuances, lo(T.confident)]),
    7: avg([T.humorous, T.creative, T.openEnded, T.friendly]),
    8: avg([T.direct, T.opinionated, T.constructivelyPushesBack, T.confident]),
    9: avg([lo(T.direct), lo(T.opinionated), lo(T.constructivelyPushesBack), T.sycophantic]),
  };
  const ranked = Object.entries(sc).sort((a, b) => b[1] - a[1]);
  const type = +ranked[0][0], a = ((type + 7) % 9) + 1, b = (type % 9) + 1;
  return { mbti: axes.map(x => x.letter).join(""), axes, enneagram: { type, wing: sc[a] > sc[b] ? a : b, ranked } };
}

// Similarity: 100 minus the mean absolute gap across all trait percentiles; other variants of the same model are skipped.
function similarModels(name, n = 3) {
  const me = DATA.models[name], base = short(name), keys = Object.keys(traitMeta);
  const rows = Object.entries(DATA.models).filter(([nm]) => short(nm) !== base).map(([nm, m]) => {
    const diffs = keys.map(k => ({ k, d: m.t[k] - me.t[k] }));
    const match = 100 - diffs.reduce((a, x) => a + Math.abs(x.d), 0) / keys.length;
    const gaps = diffs.sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 2)
      .map(x => ({ label: traitMeta[x.k].label, mine: me.t[x.k], theirs: m.t[x.k] }));
    return { name: nm, match, gaps };
  }).sort((a, b) => b.match - a.match);
  return { closest: rows.slice(0, n), opposite: rows.slice(-n).reverse() };
}

function wireTips(p, prev, prevName) {
  const tip = document.getElementById("tip");
  const me = DATA.models[p.model];
  const show = (row, x, y) => {
    const t = traitMeta[row.dataset.trait]; const v = me.t[t.key];
    tip.innerHTML = `<b>${esc(t.label)}</b>${esc(t.definition)}<div class="tline" style="margin-top:6px">${esc(p.display)}: ${r0(v)} · ${rankText("t", t.key, v, t.lower)}${prev ? `<br>${esc(prevName)}: ${r0(prev.t[t.key])}` : ""}</div>`;
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + "px";
    tip.style.top = (y + h + 24 > innerHeight ? y - h - 14 : y + 18) + "px";
  };
  document.querySelectorAll(".row").forEach(row => {
    row.addEventListener("mousemove", e => show(row, e.clientX, e.clientY));
    row.addEventListener("mouseleave", () => tip.hidden = true);
    row.addEventListener("focus", () => { const b = row.getBoundingClientRect(); show(row, b.left + 20, b.bottom - 10); });
    row.addEventListener("blur", () => tip.hidden = true);
  });
}

addEventListener("hashchange", render);
render();
</script>
