<script>
const DATA = /*__DATA__*/null;
const PROFILES = /*__PROFILES__*/null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const r0 = v => Math.round(v);
const allModels = Object.values(DATA.models);
const N = allModels.length;
const traitMeta = {}; DATA.indexes.forEach(ix => ix.traits.forEach(t => traitMeta[t.key] = { ...t, index: ix.key }));
const indexMeta = {}; DATA.indexes.forEach(ix => indexMeta[ix.key] = ix);
const short = name => name.replace(/\s*\(.*\)\s*$/, "");
const fmtDate = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });

function rankOf(kind, key, value, lower) {
  const vals = allModels.map(m => m[kind][key]).filter(v => v != null);
  const better = lower ? vals.filter(v => v < value).length : vals.filter(v => v > value).length;
  return { rank: better + 1, of: vals.length };
}
function rankText(kind, key, value, lower) {
  const { rank, of } = rankOf(kind, key, value, lower);
  return lower ? `#${rank} lowest of ${of}` : `#${rank} of ${of}`;
}
function refFor(p, ref) {
  const [kind, key] = ref.split(":");
  const me = DATA.models[p.model];
  if (kind === "i") { const ix = indexMeta[key]; return { label: ix.label + " index", v: me.i[key], lower: ix.lower, rk: rankText("i", key, me.i[key], ix.lower) }; }
  const t = traitMeta[key]; return { label: t.label, v: me.t[key], lower: t.lower, rk: rankText("t", key, me.t[key], t.lower) };
}
function bar(v, prev) {
  return `<div class="bar" aria-hidden="true"><div class="fill" style="width:${Math.max(0, Math.min(100, v))}%"></div>${prev != null ? `<div class="prev" style="left:${prev}%"></div>` : ""}</div>`;
}

// MBTI and Enneagram rules: the same fixed rules as for-fun/aa-personalitybench-2026-10-24.md
// ("Just for fun: MBTI and Enneagram guesses"). Change them there and here together.
const ENN = { 1: { name: "Reformer" }, 2: { name: "Helper" }, 3: { name: "Achiever" }, 4: { name: "Individualist" }, 5: { name: "Investigator" },
  6: { name: "Loyalist" }, 7: { name: "Enthusiast" }, 8: { name: "Challenger" }, 9: { name: "Peacemaker" } };
function personalityTypes(m) {
  const I = m.i, T = m.t, lo = v => 100 - v, avg = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
  const near = (a, b) => Math.abs(a - b) < 0.05, EPS = 1e-9; // EPS: ignore float noise, so exact ties follow the rule
  const ei = avg([I.warmth, I.expressiveness, T.humorous]);
  const n = avg([I.imagination, T.metaphorical]), s = avg([T.pragmatic, T.providesActionableGuidance, T.resourceSpecific]);
  const f = avg([T.friendly, T.emotionallyIntelligent, T.sincere]), t = avg([T.direct, T.evidenceBased, T.truthful]);
  const j = avg([T.structured, T.answerFirst, T.summarizesBottomLine]), p = T.openEnded;
  const axes = [
    ei >= 50 ? { letter: "E", name: "Extraverted", why: `Warmth, Expressiveness and Humorous average ${r0(ei)} (E from 50)` }
             : { letter: "I", name: "Introverted", why: `Warmth, Expressiveness and Humorous average ${r0(ei)} (E from 50)` },
    { letter: n >= s - EPS ? "N" : "S", name: n >= s - EPS ? "Intuitive" : "Sensing", tie: near(n, s),
      why: `Imagination and metaphor ${r0(n)} vs practical detail ${r0(s)}` },
    { letter: f > t + EPS ? "F" : "T", name: f > t + EPS ? "Feeling" : "Thinking", tie: near(f, t),
      why: `Directness, evidence and truthfulness ${r0(t)} vs warmth traits ${r0(f)}${near(f, t) ? " (a tie goes to T)" : ""}` },
    { letter: j >= p - EPS ? "J" : "P", name: j >= p - EPS ? "Judging" : "Perceiving", tie: near(j, p),
      why: `Structure, answer-first and bottom line ${r0(j)} vs open-ended ${r0(p)}` },
  ];
  const sc = {
    1: avg([T.truthful, T.structured, T.direct, lo(I.slop)]),
    2: avg([T.friendly, T.emotionallyIntelligent, T.sincere, T.sycophantic]),
    3: avg([T.answerFirst, T.confident, T.providesActionableGuidance, T.scannable]),
    4: avg([T.eloquent, T.metaphorical, T.sincere, T.creative]),
    5: avg([T.informationDense, T.evidenceBased, T.resourceSpecific, lo(T.friendly)]),
    6: avg([T.admitsUncertainty, T.disclaimsWithAssumptions, T.flagsNuances, lo(T.confident)]),
    7: avg([T.humorous, T.creative, T.openEnded, T.friendly]),
    8: avg([T.direct, T.opinionated, T.constructivelyPushesBack, T.confident]),
    9: avg([lo(T.direct), lo(T.opinionated), lo(T.constructivelyPushesBack), T.sycophantic]),
  };
  const ranked = Object.entries(sc).sort((a, b) => b[1] - a[1]);
  const type = +ranked[0][0], a = ((type + 7) % 9) + 1, b = (type % 9) + 1;
  return { mbti: axes.map(x => x.letter).join(""), axes, enneagram: { type, wing: sc[a] > sc[b] ? a : b, ranked } };
}

// Similarity: 100 minus the mean absolute gap across all trait percentiles; other variants of the same model are skipped.
function similarModels(name, n = 3) {
  const me = DATA.models[name], base = short(name), keys = Object.keys(traitMeta);
  const rows = Object.entries(DATA.models).filter(([nm]) => short(nm) !== base).map(([nm, m]) => {
    const diffs = keys.map(k => ({ k, d: m.t[k] - me.t[k] }));
    const match = 100 - diffs.reduce((a, x) => a + Math.abs(x.d), 0) / keys.length;
    const gaps = diffs.sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 2)
      .map(x => ({ label: traitMeta[x.k].label, mine: me.t[x.k], theirs: m.t[x.k] }));
    return { name: nm, match, gaps };
  }).sort((a, b) => b.match - a.match);
  return { closest: rows.slice(0, n), opposite: rows.slice(-n).reverse() };
}

function render() {
  const id = (location.hash || "").slice(1);
  const p = PROFILES.find(x => x.id === id) || PROFILES[0];
  const me = DATA.models[p.model];
  const prev = p.previous ? DATA.models[p.previous] : null;
  const prevName = p.previous ? short(p.previous) : "";
  const legend = `<div class="legend"><span><i class="sw-bar"></i>${esc(p.display)}</span>${prev ? `<span><i class="sw-tick"></i>${esc(prevName)}</span>` : ""}</div>`;
  document.title = `${p.display} Personality`;

  const switcher = `<nav class="switcher" aria-label="Models">${PROFILES.length > 1 ? "" : '<span class="label">Profiles</span>'}${PROFILES.map(x =>
    `<a class="pill" href="#${x.id}" ${x.id === p.id ? 'aria-current="page"' : ""}>${esc(x.display)}</a>`).join("")}</nav>`;

  const hero = `<section class="glass hero fade">
    <div class="eyebrow">${esc(p.maker)} · ${esc(p.variant)}</div>
    <h1>${esc(p.display)}</h1>
    ${p.archetype ? `<div class="archetype"><div class="aname">${esc(p.archetype.name)}</div><div class="aline">${esc(p.archetype.line)}</div></div>` : ""}
    <p class="tagline">${esc(p.tagline)}</p>
    <div class="chips"><span class="chip">AA-PersonalityBench</span><span class="chip">${N} models compared</span><span class="chip">Captured ${fmtDate(DATA.captured)}</span></div>
  </section>`;

  const summary = `<section class="panel fade"><div class="section-head"><h2>The whole picture</h2></div>
    <div class="prose">${p.summary.map(s => `<p>${esc(s)}</p>`).join("")}</div></section>`;

  const ty = personalityTypes(me);
  const e = ty.enneagram;
  const typesSec = `<section class="panel fade"><div class="section-head"><h2>Personality types</h2><span class="note">Just for fun: a playful reading of the scores, not measured by AA</span></div>
    <div class="types">
      <div class="type-box"><div class="k">Typical MBTI</div><div class="big">${ty.mbti}</div>
        ${ty.axes.map(a => `<div class="axis"><div class="letter">${a.letter}</div><div><div class="what">${esc(a.name)}${a.tie ? '<span class="tie">tie</span>' : ""}</div><div class="why">${esc(a.why)}</div></div></div>`).join("")}
      </div>
      <div class="type-box"><div class="k">Enneagram</div><div class="big">${e.type}w${e.wing}<span>${esc(ENN[e.type].name)} with a ${esc(ENN[e.wing].name)} wing</span></div>
        <div class="enn">${e.ranked.map(([k, v]) => `<div class="enn-row ${+k === e.type ? "win" : ""}"><span>${k} ${esc(ENN[k].name)}</span>${bar(v)}<span class="n">${r0(v)}</span></div>`).join("")}</div>
        <div class="why" style="font-size:13px;color:var(--faint)">Each type averages four traits; the highest wins, and the higher-scoring neighbour is the wing.</div>
      </div>
    </div>
    ${p.typesNote ? `<p class="types-note">${esc(p.typesNote)}</p>` : ""}</section>`;

  const cardList = (items, cls, tagText) => items.map(c => `<div class="card">
      <div class="card-top"><h3>${esc(c.title)}</h3><span class="tag ${cls}">${tagText}</span></div>
      <p>${esc(c.body)}</p>
      <div class="refs">${c.refs.map(r => { const x = refFor(p, r); return `<span class="ref">${esc(x.label)} <b>${r0(x.v)}</b>${x.lower ? " ↓" : ""} · ${x.rk}</span>`; }).join("")}</div>
    </div>`).join("");
  const sg = `<div class="two">
    <section class="panel fade"><div class="section-head"><h2>Where it shines</h2></div><div class="cards">${cardList(p.strengths, "good", "Strength")}</div></section>
    <section class="panel fade"><div class="section-head"><h2>Where it falls short</h2></div><div class="cards">${cardList(p.gaps, "gap", "Watch")}</div></section>
  </div>`;

  const uses = p.bestFor ? `<div class="two">
    <section class="panel fade"><div class="section-head"><h2>Most helpful for</h2></div><div class="cards">${cardList(p.bestFor, "good", "Good fit")}</div></section>
    <section class="panel fade"><div class="section-head"><h2>Least helpful for</h2></div><div class="cards">${cardList(p.worstFor || [], "gap", "Poor fit")}</div></section>
  </div>` : "";

  const sim = similarModels(p.model);
  const variant = nm => (nm.match(/\(([^)]*)\)\s*$/) || [])[1] || "";
  const simRow = s => `<div class="sim-row"><div class="sim-name">${esc(short(s.name))}${variant(s.name) ? `<small>${esc(variant(s.name))}</small>` : ""}</div><div class="sim-score">${r0(s.match)}<span>match</span></div>
    <div class="sim-why">Biggest gaps: ${s.gaps.map(g => `${esc(g.label)} ${r0(g.mine)} vs ${r0(g.theirs)}`).join(" · ")}</div></div>`;
  const simSec = `<section class="panel fade"><div class="section-head"><h2>Who writes most like it</h2><span class="note">Across all 30 traits</span></div>
    <div class="two sims"><div><h3 class="sim-h">Closest</h3>${sim.closest.map(simRow).join("")}</div>
    <div><h3 class="sim-h">Most opposite</h3>${sim.opposite.map(simRow).join("")}</div></div>
    <p class="method" style="margin-top:16px">Match is 100 minus the average gap between the two models' trait percentiles. Other settings of the same model are left out.</p></section>`;

  const idx = `<section class="panel fade"><div class="section-head"><h2>Eight indexes</h2>${legend}</div>
    <div class="idx-grid">${DATA.indexes.map(ix => { const v = me.i[ix.key]; return `<div class="idx">
      <div class="name">${esc(ix.label)}${ix.lower ? "<small>lower is better</small>" : ""}</div>
      <div class="num">${r0(v)}<span>percentile</span></div>
      ${bar(v, prev ? prev.i[ix.key] : null)}
      <div class="rank">${rankText("i", ix.key, v, ix.lower)}${prev ? ` · ${esc(prevName)}: ${r0(prev.i[ix.key])}` : ""}</div>
      <div class="desc">${esc(ix.description)}</div></div>`; }).join("")}</div></section>`;

  const groups = DATA.indexes.filter(ix => ix.key !== "slop").map(ix => `<div class="group">
      <h3>${esc(ix.label)}<span>index ${r0(me.i[ix.key])}</span></h3>
      ${ix.traits.map(t => { const v = me.t[t.key]; return `<div class="row" tabindex="0" data-trait="${t.key}"
          aria-label="${esc(t.label)}: ${r0(v)}th percentile, ${rankText("t", t.key, v, t.lower)}${prev ? `; ${esc(prevName)} ${r0(prev.t[t.key])}` : ""}">
        <div class="lab">${esc(t.label)}${t.lower ? "<em>lower is better</em>" : ""}</div><div class="val">${r0(v)}</div>${bar(v, prev ? prev.t[t.key] : null)}</div>`; }).join("")}
    </div>`).join("");
  const traits = `<section class="panel fade"><div class="section-head"><h2>All 30 traits</h2>${legend}</div>
    <div class="groups">${groups}</div>
    <p class="method" style="margin-top:16px">Slop is a single trait, so its score is the Slop index above. Hover or tab to a trait for its definition.</p></section>`;

  const cmpModels = [p.model, ...(p.compare || [])];
  const cmp = `<section class="panel fade"><div class="section-head"><h2>Next to its neighbours</h2><span class="note">Index percentiles</span></div>
    <div class="table-wrap"><table><thead><tr><th>Index</th>${cmpModels.map(n => `<th>${esc(short(n))}</th>`).join("")}</tr></thead>
    <tbody>${DATA.indexes.map(ix => `<tr><td>${esc(ix.label)}${ix.lower ? '<span class="lower">lower is better</span>' : ""}</td>${cmpModels.map((n, k) =>
      `<td class="${k === 0 ? "me" : ""}">${r0(DATA.models[n].i[ix.key])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="versus">${(p.versus || []).map(s => `<p>${esc(s)}</p>`).join("")}</div></section>`;

  const tips = `<section class="panel fade"><div class="section-head"><h2>Getting the best from it</h2></div>
    <ul class="tips">${p.tips.map(t => `<li><span>${esc(t)}</span></li>`).join("")}</ul></section>`;

  const method = `<section class="panel fade"><div class="section-head"><h2>How to read this</h2></div><div class="method">
    <p>AA-PersonalityBench measures how a model writes, not whether it is right. A panel of judge models compares answers in pairs on 30 traits; each trait becomes an Elo score, and each index averages its traits. Every number here is a percentile across the ${N} models tested: higher means more of that trait. For Sycophantic and Slop, lower is better.</p>
    <p>The field includes older and smaller models such as GPT-3.5 Turbo, so a high percentile means high against everything tested, not only against frontier models. Each profile covers one settings variant of a model, named under its title.</p>
    <p>Source: <a href="${esc(DATA.source)}" target="_blank" rel="noopener">Artificial Analysis, AA-PersonalityBench</a>, captured ${fmtDate(DATA.captured)}. Profile text and the archetype are written by Claude from these scores. The MBTI and Enneagram come from fixed rules over the percentiles, so the same scores always give the same types; an exact tie follows the rule's default (N, T or J).</p>
  </div></section>`;

  document.getElementById("app").innerHTML = switcher + hero + summary + typesSec + uses + sg + simSec + idx + traits + cmp + tips + method;
  wireTips(p, prev, prevName);
  window.scrollTo(0, 0);
}

function wireTips(p, prev, prevName) {
  const tip = document.getElementById("tip");
  const me = DATA.models[p.model];
  const show = (row, x, y) => {
    const t = traitMeta[row.dataset.trait]; const v = me.t[t.key];
    tip.innerHTML = `<b>${esc(t.label)}</b>${esc(t.definition)}<div class="tline" style="margin-top:6px">${esc(p.display)}: ${r0(v)} · ${rankText("t", t.key, v, t.lower)}${prev ? `<br>${esc(prevName)}: ${r0(prev.t[t.key])}` : ""}</div>`;
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + "px";
    tip.style.top = (y + h + 24 > innerHeight ? y - h - 14 : y + 18) + "px";
  };
  document.querySelectorAll(".row").forEach(row => {
    row.addEventListener("mousemove", e => show(row, e.clientX, e.clientY));
    row.addEventListener("mouseleave", () => tip.hidden = true);
    row.addEventListener("focus", () => { const b = row.getBoundingClientRect(); show(row, b.left + 20, b.bottom - 10); });
    row.addEventListener("blur", () => tip.hidden = true);
  });
}

addEventListener("hashchange", render);
render();
</script>
